<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>KT TV Content Manager</title>
    <!-- Absolute path on purpose: if the page is opened as /admin (no trailing slash) a relative "config.yml" would be looked up at the site root and fail. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!--
      Decap CMS. Version 3.17.0 or newer is REQUIRED for the Turbo login (turbo-github);
      "^3.0.0" always picks the newest 3.x release, so this is satisfied automatically.
      Decap reads its settings from /admin/config.yml (next to this file).
    -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
